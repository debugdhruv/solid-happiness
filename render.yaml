services:
  - type: web
    runtime: python
    name: solid-happiness-backend
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    initialDeployHook: python scripts/generate_data.py --rows 15000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: solid-happiness-db
          property: connectionString
      - key: BACKEND_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app

databases:
  - name: solid-happiness-db
    plan: free
    postgresMajorVersion: "16"
